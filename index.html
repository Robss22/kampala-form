<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SMART STATS UG</title>
<style>
  *{box-sizing:border-box}
  body{margin:0;font-family:-apple-system,BlinkMacSystemFont,Arial,sans-serif;background:#f8fafc;color:#0f172a}
  .top{text-align:center;padding:22px 14px 10px}
  .top h1{margin:0;font-size:26px;letter-spacing:-0.5px;font-weight:800}
  .top p{margin:6px 0;color:#64748b;font-size:14px}
  .tabs{display:flex;justify-content:center;gap:8px;margin:14px 0}
  .tab{border:none;padding:10px 20px;border-radius:999px;font-weight:600;font-size:14px;background:#e2e8f0;cursor:pointer}
  .tab.active{background:#0f172a;color:#fff}
  .wrap{max-width:560px;margin:0 auto;padding:0 12px 30px}
  .card{background:#fff;border-radius:16px;padding:14px;margin:12px 0;box-shadow:0 4px 12px rgba(0,0,0,.06);border:1px solid #eef2f7}
  .head{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
  .match{font-weight:800;font-size:15px;line-height:1.25;flex:1}
  .badge{white-space:nowrap;padding:6px 10px;border-radius:999px;font-size:12px;font-weight:700;color:#fff;background:#16a34a}
  .meta{display:flex;justify-content:space-between;margin-top:10px;font-size:13px;color:#475569}
  .stats{margin-top:10px;background:#f1f5f9;border-radius:10px;padding:10px;font-size:13px;line-height:1.4;color:#334155}
  .foot{display:flex;justify-content:space-between;align-items:center;margin-top:10px}
  .odds{font-weight:800}
  .result{padding:4px 10px;border-radius:999px;font-size:12px;font-weight:800}
  .PENDING{background:#fef9c3;color:#854d0e}
  .WON{background:#dcfce7;color:#166534}
  .LOST{background:#fee2e2;color:#991b1b}
  .empty{text-align:center;color:#94a3b8;padding:40px 0}
  .history-date{font-weight:700;margin:18px 4px 8px;font-size:13px;color:#475569}
</style>
</head>
<body>
<div class="top">
  <h1>SMART STATS UG</h1>
  <p>Max 3 Picks Daily</p>
  <p id="dateText">Loading...</p>
  <div class="tabs">
    <button id="tToday" class="tab active" onclick="switchTab('today')">Today</button>
    <button id="tHist" class="tab" onclick="switchTab('history')">History</button>
  </div>
</div>

<div class="wrap">
  <div id="today"></div>
  <div id="history" style="display:none"></div>
</div>

<script>
let loadedData = null;

async function load(){
  try{
    const res = await fetch('./picks.json?v=' + Date.now());
    const data = await res.json();
    loadedData = data;
    document.getElementById('dateText').innerText = 'Date: ' + (data.date || new Date().toISOString().slice(0,10));
    renderToday(data);
    renderHistory(data);
  }catch(e){
    document.getElementById('today').innerHTML = '<div class="empty">Failed to load. Refresh.</div>';
  }
}

function renderToday(data){
  const cont = document.getElementById('today');
  if(!data.picks || data.picks.length===0){
    cont.innerHTML = '<div class="empty">No picks for today yet.<br>Check back at 10 AM EAT</div>';
    return;
  }
  cont.innerHTML = data.picks.map(p=>{
    const res = (p.result || p.status || 'PENDING').toUpperCase();
    const time = p.time || p.kickoff || '';
    const market = p.market || p.pick || 'Over 1.5 Goals';
    const stats = p.stats || p.reason || p.analysis || 'Selected based on last 10 form';
    const odds = p.odds || p.odd || '1.30';
    const match = p.match || p.fixture || (p.home && p.away ? p.home+' vs '+p.away : 'Match');
    return `
    <div class="card">
      <div class="head">
        <div class="match">${match}</div>
        <div class="badge">${market}</div>
      </div>
      <div class="meta">
        <span>${time} UTC</span>
        <span>Pick: <b>${market}</b></span>
      </div>
      <div class="stats">${stats}</div>
      <div class="foot">
        <div class="odds">${odds}</div>
        <div class="result ${res}">${res}</div>
      </div>
    </div>`;
  }).join('');
}

function renderHistory(data){
  const cont = document.getElementById('history');
  let hist = data.history;
  // try load history.json if present
  fetch('./history.json?v='+Date.now()).then(r=>r.json()).then(h=>{
    if(h && h.length>0) buildHistory(h);
  }).catch(()=>{ if(hist) buildHistory(hist); });

  function buildHistory(list){
    if(!list || list.length===0){ cont.innerHTML='<div class="empty">No history yet</div>'; return;}
    let html='';
    list.slice().reverse().slice(0,30).forEach(day=>{
      const picks = day.picks || day.games || [];
      html += `<div class="history-date">${day.date}</div>`;
      picks.forEach(p=>{
        const res = (p.result||'PENDING').toUpperCase();
        html += `<div class="card" style="margin:6px 0">
          <div class="head"><div class="match" style="font-size:14px">${p.match}</div><div class="result ${res}">${res}</div></div>
        </div>`;
      });
    });
    cont.innerHTML = html;
  }
}

function switchTab(t){
  document.getElementById('today').style.display = t==='today'?'block':'none';
  document.getElementById('history').style.display = t==='history'?'block':'none';
  document.getElementById('tToday').className = t==='today'?'tab active':'tab';
  document.getElementById('tHist').className = t==='history'?'tab active':'tab';
  if(t==='history' && loadedData) renderHistory(loadedData);
}

load();
</script>
</body>
</html>
