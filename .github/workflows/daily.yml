name: Daily Predictions
on:
  schedule:
    - cron: '0 7 * * *'
    - cron: '*/30 13-22 * * *'
  workflow_dispatch:
jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      - run: pip install requests
      - name: Morning picks
        if: github.event.schedule == '0 7 * * *' || github.event_name == 'workflow_dispatch'
        run: python predict.py
        env:
          FOOTBALL_TOKEN: ${{ secrets.FOOTBALL_TOKEN }}
      - name: Live update
        if: github.event.schedule != '0 7 * * *' || github.event_name == 'workflow_dispatch'
        run: python live.py
        env:
          FOOTBALL_TOKEN: ${{ secrets.FOOTBALL_TOKEN }}
      - run: |
          git config user.name "bot"
          git config user.email "bot@bot.com"
          git add picks.json live.json history.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Update" && git push)
