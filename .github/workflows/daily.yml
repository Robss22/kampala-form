name: Daily Predictions
on:
  schedule:
    - cron: '0 7 * * *'  # 10AM EAT = 7AM UTC
  workflow_dispatch:
jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      - run: pip install requests
      - run: python predict.py
        env:
          FOOTBALL_TOKEN: ${{ secrets.FOOTBALL_TOKEN }}
      - run: |
          git config user.name "bot"
          git config user.email "bot@bot.com"
          git add picks.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Update picks" && git push)
