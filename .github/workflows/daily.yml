name: Smart Stats UG
on:
  schedule:
    - cron: '0 7 * * *'          # 10:00 EAT - build today's picks
    - cron: '*/10 12-23 * * *'   # match hours - live scores + results
    - cron: '30 0 * * *'         # after midnight - settle late games
  workflow_dispatch:
    inputs:
      force:
        description: 'Rebuild picks even if today already has some (1 = yes)'
        required: false
        default: ''

concurrency:
  group: smart-stats
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - name: Morning picks
        if: github.event.schedule == '0 7 * * *' || github.event_name == 'workflow_dispatch'
        run: python predict.py
        env:
          FOOTBALL_TOKEN: ${{ secrets.FOOTBALL_TOKEN }}
          FORCE: ${{ inputs.force }}
      - name: Live scores, results, history
        run: python live.py
        env:
          FOOTBALL_TOKEN: ${{ secrets.FOOTBALL_TOKEN }}
      - name: Commit
        run: |
          git config user.name "bot"
          git config user.email "bot@users.noreply.github.com"
          git add picks.json live.json history.json
          git diff --staged --quiet && exit 0
          git commit -m "update"
          git pull --rebase && git push
