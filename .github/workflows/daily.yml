name: Daily Picks Update
on:
  schedule:
    - cron: '0 7 * * *'
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      - run: pip install requests
      - run: python predict.py
        env:
          FOOTBALL_TOKEN: ${{ secrets.FOOTBALL_TOKEN }}
      - run: |
          git config user.name "Robss22"
          git config user.email "robss22@users.noreply.github.com"
          git add -A
          git diff --staged --quiet || git commit -m "auto update $(date -u)"
          git push
