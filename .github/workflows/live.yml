name: Live Score Update
on:
  schedule:
    - cron: '*/10 * * * *' # every 10 mins
  workflow_dispatch:
jobs:
  live:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      - run: pip install requests
      - run: python live_update.py
        env:
          FOOTBALL_TOKEN: ${{ secrets.FOOTBALL_TOKEN }}
      - run: |
          git config user.name "Robss22"
          git config user.email "robss22@users.noreply.github.com"
          git add live.json
          git diff --staged --quiet || git commit -m "live update"
          git push
